<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
   <link rel="stylesheet"  href="signup.css">
</head>

<body>

<div class="mainCard">

    <form class="loginForm" novalidate>
        <h1>Sign Up</h1>
        
        <label class="heading">Email</label>
        <input id="email" type="email" required>
        
        <label class="heading">Password</label>
        <input id="password" type="password" required>
        
        <label class="heading">Mobile No.</label>
        <input id="phone" type="number" required>
        
        <button type="submit" class="submitbutton">Submit</button>
        <div class="btn">
          <button class="googleBtn">    
            Continue with 
      <img src="./download.png" class="googleIcon">
  </button>
   <button class="googleBtn">
      Continue with 
      <img src="./fb.png" class="googleIcon">
  </button>
        
        </div>
        <div class="link">
            <a href="login.html">Already have an account?</a>
        </div>
    </form>
    <div class="sidePhoto">
        <img src="./images.jpeg" class="image" alt="Signup Image">
    </div>

</div>

<script src="signup.js">
   
</script>
</body>
</html>
